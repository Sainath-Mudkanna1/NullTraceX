<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NullTraceX | Private Server Telemetry Logs</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            background: #0d1117;
            color: #c9d1d9;
            padding: 24px;
        }
        h2 {
            color: #58a6ff;
            margin-bottom: 6px;
        }
        p {
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 10px;
            background: #161b22;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #30363d;
        }
        th, td {
            border: 1px solid #30363d;
            padding: 10px 14px;
            text-align: left;
            font-size: 0.85rem;
        }
        th {
            background: #21262d;
            color: #58a6ff;
        }
        tr:nth-child(even) {
            background: #161b22;
        }
        tr:hover {
            background: #1f242c;
        }
    </style>
</head>
<body>
    <h2>🔒 NullTraceX Private Server Telemetry Logs</h2>
    <p>Real-time server processing metrics, IP activity, and adversarial shield intensity logs.</p>
    
    <table>
        <tr>
            {% for col in headers %}
            <th>{{ col }}</th>
            {% endfor %}
        </tr>
        {% for row in logs %}
        <tr>
            {% for cell in row %}
            <td>{{ cell }}</td>
            {% endfor %}
        </tr>
        {% endfor %}
    </table>
</body>
</html>
